
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopping Cart</title>
    <style>
        body { font-family: Arial; background: #eaeded; margin: 0; }
        header { background: #131921; color: white; padding: 20px; }
        main { max-width: 850px; margin: 25px auto; padding: 20px; }
        .item { background: white; padding: 18px; margin: 12px 0;
                display: flex; justify-content: space-between;
                align-items: center; gap: 12px; flex-wrap: wrap; }
        button { background: #ff9900; border: 0; padding: 10px;
                 cursor: pointer; border-radius: 4px; }
        .total { font-size: 22px; font-weight: bold; }
        a { color: #007185; }
    </style>
</head>
<body>
<header><h2>Amazon Shopping Cart 🛒</h2></header>
<main>
    <h2>Your Cart</h2>
    {% for item in items %}
    <div class="item">
        <div>
            <h3>{{ item.emoji }} {{ item.name }}</h3>
            <p>Quantity: {{ item.quantity }}</p>
            <p>Subtotal: ₹{{ "{:,}".format(item.subtotal) }}</p>
        </div>
        <form action="/remove/{{ item.id }}" method="post">
            <button type="submit">Remove</button>
        </form>
    </div>
    {% else %}
    <p>Your cart is empty.</p>
    {% endfor %}

    <p class="total">Total: ₹{{ "{:,}".format(total) }}</p>
    <a href="/">Continue Shopping</a>
</main>
</body>
</html>
